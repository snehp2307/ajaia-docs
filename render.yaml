# Render Blueprint: one web service (Docker) + one free Postgres database
services:
  - type: web
    name: ajaia-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"

databases:
  - name: ajaia-docs-db
    plan: free
